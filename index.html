<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autobank-X 銀行模擬</title>
  <meta name="description" content="銀行分行每日作業模擬：樓層、大廳、叫號、員工與客戶、送件與金庫作業。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">X</div>
      <div class="brand-text">
        <div id="bankName" class="bank-name">Autobank-X</div>
        <div id="branchName" class="sub"></div>
      </div>
    </div>
    <div class="clock">
      <div class="clock-date"><span id="dateLabel">Day 1</span><span id="weekLabel" class="week">星期一</span></div>
      <div id="timeLabel" class="time">00:00:00</div>
    </div>
    <div id="phaseChip" class="chip">—</div>
    <div class="controls">
      <button id="btnPlay" class="btn play">▶ 開始</button>
      <div class="seg" id="speedSeg" role="radiogroup" aria-label="模擬速度"></div>
      <button id="btnHour" class="btn" title="立即模擬 1 小時">+1 小時</button>
      <button id="btnNextDay" class="btn" title="快轉至下一天的起始時間">下一天</button>
      <button id="btnReset" class="btn">重置</button>
      <a class="btn" href="admin.html">後台設定</a>
    </div>
  </header>

  <div id="banner" class="banner" hidden>
    <span>後台設定已更新。</span>
    <button id="btnApplyReset" class="btn primary small">套用並重置模擬</button>
    <button id="btnApplyLive" class="btn small" title="營業時間、來客量、送件時間等立即生效；員工名單需重置才會生效">僅套用營運參數</button>
    <button id="btnBannerClose" class="btn small ghost">稍後</button>
  </div>

  <div class="page">
    <section id="kpis" class="kpis" aria-label="即時指標"></section>

    <section class="card timeline-wrap">
      <div class="timeline-head">
        <h3>今日作業時程</h3>
        <span id="timelineInfo" class="muted"></span>
      </div>
      <div id="timeline" class="timeline"></div>
      <div class="timeline-axis"><span>00</span><span>03</span><span>06</span><span>09</span><span>12</span><span>15</span><span>18</span><span>21</span><span>24</span></div>
    </section>

    <main class="layout">
      <section class="card floors">
        <div class="floors-head">
          <div id="floorTabs" class="tabs" role="tablist"></div>
          <div class="opts">
            <div class="seg light" id="viewSeg" role="radiogroup" aria-label="顯示方式">
              <button role="radio" data-v="25">2.5D 立體</button><button role="radio" data-v="2d">2D 平面</button>
            </div>
            <label><input type="checkbox" id="optLabels"> 員工狀態</label>
            <label><input type="checkbox" id="optSound"> 叫號音效</label>
            <label><input type="checkbox" id="optVoice"> 語音叫號</label>
          </div>
        </div>
        <div id="floorGrid" class="floor-grid"></div>
        <details class="legend-box" open>
          <summary>圖例</summary>
          <div id="legend" class="legend"></div>
        </details>
      </section>

      <aside class="side">
        <section class="board">
          <div class="board-head"><span>叫號看板</span><span id="boardClock" class="board-clock"></span></div>
          <div id="boardNow" class="board-now">—</div>
          <div id="boardList" class="board-list"></div>
          <div id="queueSummary" class="queue-summary"></div>
        </section>
        <section class="card">
          <div class="subtabs" role="tablist" data-group="side">
            <button class="subtab active" data-tab="points">服務窗口</button>
            <button class="subtab" data-tab="stats">今日統計</button>
            <button class="subtab" data-tab="docs">送件流程</button>
            <button class="subtab" data-tab="incidents">臨時事件 <span id="incBadge" class="badge"></span></button>
          </div>
          <div class="tabpane" data-pane="points"><div id="points" class="points"></div></div>
          <div class="tabpane" data-pane="stats" hidden><div id="stats"></div></div>
          <div class="tabpane" data-pane="incidents" hidden>
            <div class="drill">
              <label for="drillType">事件演練</label>
              <select id="drillType"></select>
              <button id="btnDrill" class="btn small primary">觸發</button>
              <span id="drillMsg" class="drill-msg"></span>
            </div>
            <div id="incActive" class="inc-list"></div>
            <h4 class="inc-sub">今日已排除</h4>
            <div id="incDone" class="inc-done"></div>
          </div>
          <div class="tabpane" data-pane="docs" hidden>
            <div id="pipeline" class="pipeline"></div>
            <div id="docList" class="doc-list"></div>
          </div>
        </section>
      </aside>
    </main>

    <section class="card bottom">
      <div class="bottom-head">
        <div class="subtabs" role="tablist" data-group="bottom">
          <button class="subtab active" data-tab="staff">員工動態 <span id="staffCount" class="badge"></span></button>
          <button class="subtab" data-tab="roster">排班表 <span id="rosterBadge" class="badge"></span></button>
          <button class="subtab" data-tab="log">事件紀錄</button>
          <button class="subtab" data-tab="reports">每日報表</button>
        </div>
        <div class="tools" data-tools="staff">
          <input id="staffSearch" type="search" placeholder="搜尋姓名或作業">
          <select id="staffRole"><option value="">全部職務</option></select>
          <select id="staffFloor">
            <option value="">全部樓層</option><option value="1">1F</option><option value="2">2F</option><option value="3">3F</option><option value="-1">B1</option><option value="off">外出／未在班</option><option value="leave">請假／排休</option>
          </select>
        </div>
        <div class="tools" data-tools="log" hidden>
          <select id="logFilter">
            <option value="">全部分類</option>
            <option>叫號</option><option>櫃檯</option><option>客戶</option><option>員工</option>
            <option>事件</option><option>排班</option><option>送件</option><option>金庫</option><option>盤點</option><option>保全</option><option>系統</option>
          </select>
        </div>
        <div class="tools" data-tools="reports" hidden>
          <button id="btnCsv" class="btn small">匯出 CSV</button>
        </div>
      </div>
      <div class="tabpane" data-pane="staff">
        <div class="table-wrap"><table class="table" id="staffTable">
          <thead><tr><th>員工</th><th>職務・資歷</th><th>特色</th><th>位置</th><th>目前作業</th></tr></thead>
          <tbody></tbody>
        </table></div>
      </div>
      <div class="tabpane" data-pane="roster" hidden>
        <div id="rosterSummary" class="roster-summary"></div>
        <div class="table-wrap roster-wrap"><table class="roster" id="rosterTable"></table></div>
        <div class="roster-legend">
          <span><i class="rc work">班</i>上班</span><span><i class="rc off">休</i>排休／輪休</span><span><i class="rc leave">特休</i>請假（上／下＝半天）</span>
          <span><i class="rc sub">代班</i>代理他人職務</span><span><i class="rc callin">調班</i>週六調班</span><span><i class="rc temp">支援</i>鄰近分行派員</span>
          <span class="muted">點今天或之後的格子可以請假或取消請假</span>
        </div>
        <div id="leaveMenu" class="leave-menu" hidden></div>
      </div>
      <div class="tabpane" data-pane="log" hidden><div id="log" class="log"></div></div>
      <div class="tabpane" data-pane="reports" hidden>
        <div class="table-wrap"><table class="table" id="reportTable">
          <thead><tr><th>日期</th><th>來客</th><th>完成</th><th>放棄</th><th>平均等候</th><th>最長等候</th><th>ATM</th><th>產生文件</th><th>送達總行</th><th>送件趟數</th><th>運鈔</th><th>主管授權</th><th>臨時事件</th><th>阻詐金額</th><th>請假／代班</th><th>加班人次</th><th>最後離開</th><th>金庫庫存</th></tr></thead>
          <tbody></tbody>
        </table></div>
      </div>
    </section>

    <footer class="foot">Autobank-X 銀行作業模擬・模擬時間預設與真實時間 1:1・點擊人物可追蹤・空白鍵開始／暫停</footer>
  </div>

  <div id="tooltip" class="tooltip" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/settings.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/people.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/incidents.js"></script>
  <script src="js/roster.js"></script>
  <script src="js/render.js"></script>
  <script src="js/render25.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
